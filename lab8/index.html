<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №8 — Менеджер завдань (TypeScript)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .back-link {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .app-header__subtitle {
            color: #64748b;
            font-size: 14px;
            margin-top: 4px;
        }
        .github-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #1f2328;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }
        .github-fab:hover {
            background-color: #000000;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }
        .github-fab svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }
        @media (max-width: 600px) {
            .github-fab {
                bottom: 16px;
                right: 16px;
                padding: 8px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="nav-links">
                <a href="../index.html" class="back-link">← На головну</a>
                <a href="https://github.com/scarecrow118/it_college_web_course/tree/main/lab8" target="_blank" rel="noopener noreferrer" class="back-link">Код на GitHub ↗</a>
            </div>
            <h1 class="app-header__title" id="mainHeader">Менеджер завдань (TypeScript)</h1>
            <p class="app-header__subtitle">Лабораторна робота №8 — Чупіль Юрій (КН-310)</p>
        </header>
        <section class="todo-form">
            <form id="todoForm">
                <div class="todo-form__group">
                    <input type="text" name="title" class="todo-form__input" placeholder="Назва задачі" required autocomplete="off">
                </div>
                <div class="todo-form__group">
                    <textarea name="description" class="todo-form__textarea" placeholder="Детальний опис задачі" rows="2"></textarea>
                </div>
                <div class="todo-form__row">
                    <select name="tag" class="todo-form__select">
                        <option value="Робота">Робота</option>
                        <option value="Навчання">Навчання</option>
                        <option value="Особисте">Особисте</option>
                    </select>
                    <input type="date" name="deadline" class="todo-form__input">
                </div>
                <div class="todo-form__actions">
                    <button type="reset" class="btn btn--secondary">
                        <svg class="btn__icon"><use href="img/sprite.svg#icon-reset"></use></svg> Очистити
                    </button>
                    <button type="submit" class="btn btn--primary">
                        <svg class="btn__icon"><use href="img/sprite.svg#icon-save"></use></svg> <span class="btn__text">Додати задачу</span>
                    </button>
                </div>
            </form>
        </section>

        <section id="todoList" class="task-list"></section>
    </div>

    <template id="task-template">
        <div class="task-card">
            <div class="task-card__content">
                <div class="task-card__header">
                    <span class="task-card__title"></span>
                    <span class="task-card__tag"></span>
                </div>
                <p class="task-card__desc"></p>
                <div class="task-card__meta">
                    👤 Студент ID: <strong class="task-card__userid"></strong> | 
                    🔑 Запис #<span class="task-card__id"></span> <br>
                    ⏳ Створено: <span class="task-card__created"></span> <br>
                    📅 Дедлайн: <span class="task-card__deadline"></span> <br>
                    <span class="task-card__status">Статус: В роботі</span>
                </div>
            </div>
            <div class="task-card__actions">
                <button class="btn btn--success btn--complete" title="Виконано">
                    <svg class="btn__icon"><use href="img/sprite.svg#icon-checked"></use></svg>
                </button>
                <button class="btn btn--edit btn--edit-action" title="Редагувати">
                    <svg class="btn__icon"><use href="img/sprite.svg#icon-edit"></use></svg>
                </button>
                <button class="btn btn--danger btn--delete" title="Видалити">
                    <svg class="btn__icon"><use href="img/sprite.svg#icon-delete"></use></svg>
                </button>
            </div>
        </div>
    </template>
    
    <a href="https://github.com/scarecrow118/it_college_web_course/tree/main/lab8" target="_blank" rel="noopener noreferrer" class="github-fab" title="Вихідний код на GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        <span>Код на GitHub</span>
    </a>

    <script src="dist/bundle.js"></script>
</body>
</html>
